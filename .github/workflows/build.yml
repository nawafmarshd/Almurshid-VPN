name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Find Project and Build APK
      run: |
        # البحث التلقائي عن مجلد المشروع وملف الـ gradlew
        PROJECT_DIR=$(find . -name "gradlew" -maxdepth 3 | xargs dirname)
        echo "Found project directory at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        
        # إنشاء إعدادات Cloudflare WARP تلقائياً داخل التطبيق
        mkdir -p app/src/main/assets
        echo "Generating automatic Cloudflare WARP configuration..."
        cat << 'EOF' > app/src/main/assets/servers.json
        [
          {
            "name": "Al-Murshid WARP (Automatic)",
            "type": "warp",
            "endpoint": "engage.cloudflareclient.com:2408"
          }
        ]
        EOF

        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlMurshid-APK
        path: '**/app/build/outputs/apk/release/*.apk'
