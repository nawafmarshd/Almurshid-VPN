name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Cloudflare WARP Config & Build APK
      run: |
        mkdir -p project/app/src/main/assets
        echo "Generating automatic Cloudflare WARP configuration..."
        
        cat << 'EOF' > project/app/src/main/assets/servers.json
        [
          {
            "name": "Al-Murshid WARP (Automatic)",
            "type": "warp",
            "endpoint": "engage.cloudflareclient.com:2408"
          }
        ]
        EOF

        cd project
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlMurshid-APK
        path: project/**/app/build/outputs/apk/release/*.apk
