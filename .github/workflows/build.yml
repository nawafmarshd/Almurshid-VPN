name: Build VPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        run: |
          set -e
          find_gradlew() {
            find . -type f -name gradlew -not -path "*/.git/*" \
              | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-
          }
          GRADLEW=$(find_gradlew)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found, looking for ZIP files..."
            find . -maxdepth 3 -type f -name "*.zip" -not -path "*/.git/*" | while read -r z; do
              echo "Extracting: $z"
              unzip -o -q "$z" -d extracted_project
            done
            GRADLEW=$(find_gradlew)
          fi
          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew found anywhere in the repo"
            find . -not -path "./.git/*" | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project dir: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject servers.json (WARP)
        env:
          SERVERS_JSON: ${{ secrets.WARP_SERVERS_JSON }}
        run: |
          set -e
          # 1) Source: secret first, otherwise a servers.json file at repo root
          if [ -n "$SERVERS_JSON" ]; then
            printf '%s' "$SERVERS_JSON" > /tmp/servers.json
          elif [ -f "$GITHUB_WORKSPACE/servers.json" ]; then
            cp "$GITHUB_WORKSPACE/servers.json" /tmp/servers.json
          else
            echo "::warning::No servers.json source found (secret WARP_SERVERS_JSON or root servers.json). Skipping."
            exit 0
          fi

          # 2) Destination: overwrite existing copies, otherwise use app assets
          EXISTING=$(find "$PROJECT_DIR" -type f -name servers.json -not -path "*/build/*" || true)
          if [ -n "$EXISTING" ]; then
            echo "$EXISTING" | while read -r f; do cp /tmp/servers.json "$f"; echo "Replaced: $f"; done
          else
            MANIFEST=$(find "$PROJECT_DIR" -path "*/src/main/AndroidManifest.xml" -not -path "*/build/*" | head -1)
            MAIN_DIR=$(dirname "$MANIFEST")
            mkdir -p "$MAIN_DIR/assets"
            cp /tmp/servers.json "$MAIN_DIR/assets/servers.json"
            echo "Created: $MAIN_DIR/assets/servers.json"
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK (if unsigned)
        run: |
          set -e
          shopt -s nullglob
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/release/*-unsigned.apk" | head -1)
          if [ -n "$UNSIGNED" ]; then
            keytool -genkeypair -keystore /tmp/debug.jks -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VPN"
            "$BT/zipalign" -p 4 "$UNSIGNED" /tmp/aligned.apk
            "$BT/apksigner" sign --ks /tmp/debug.jks --ks-pass pass:android \
              --key-pass pass:android --out "$(dirname "$UNSIGNED")/app-release-signed.apk" /tmp/aligned.apk
            echo "Signed APK created"
          else
            echo "APK already signed, skipping"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
